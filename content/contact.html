<!-- title: Contact | desc: Get in touch with ELMNT Earth, Sydney, Australia. -->
<p>Questions about an order, a product or a Reiki session? Send us a message and we'll get back to you as soon as we can.</p>
<p>Email: <a href="mailto:info@elmntearth.com">info@elmntearth.com</a></p>
<form class="form" name="contact" method="POST" action="/pages/thanks/" data-netlify="true" netlify-honeypot="company-url">
<input type="hidden" name="form-name" value="contact">
<p class="hp"><label>Leave blank <input name="company-url"></label></p>
<label>Name<input name="name" required autocomplete="name"></label>
<label>Email<input type="email" name="email" required autocomplete="email"></label>
<label>Order number (if it's about an order)<input name="order"></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<button class="btn" type="submit">Send message</button>
</form>
