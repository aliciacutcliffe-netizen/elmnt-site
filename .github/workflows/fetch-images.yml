name: Save images from Shopify

on:
  workflow_dispatch:
  push:
    paths:
      - "data/products.json"
      - "data/site.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add static/images data
          git diff --cached --quiet || git commit -m "Save product images locally"
          git push
