[build]
  command = "python3 build.py"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  node_bundler = "esbuild"

# Short link for the Instagram bio
[[redirects]]
  from = "/links"
  to = "/pages/links/"
  status = 301

# Old Shopify addresses → new pages, so Google links and old posts keep working
# Shopify product links inside a collection, e.g. /collections/all/products/palo-santo-incense
[[redirects]]
  from = "/collections/:collection/products/:handle"
  to = "/products/:handle/"
  status = 301

